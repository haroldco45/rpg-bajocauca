name: Descargar sitio oficial RPG-BC
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sitio.mjs
      - run: |
          git config user.name "robot-rpg-bc"
          git config user.email "robot@users.noreply.github.com"
          git add data/sitio
          git diff --cached --quiet && exit 0
          git commit -m "[robot] sitio oficial"
          git pull --rebase origin main
          git push

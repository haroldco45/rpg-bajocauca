name: Robot de redes RPG-BC

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: robot-redes
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Herramienta para achicar fotos
        run: command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - name: Revisar redes y noticias
        run: node scripts/robot.mjs
      - name: Guardar novedades
        run: |
          git config user.name "robot-rpg-bc"
          git config user.email "robot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nada nuevo"; exit 0; fi
          git commit -m "[robot] redes $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
